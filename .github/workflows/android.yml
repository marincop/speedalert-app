name: android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner image ships the Android SDK, but `sdkmanager` is not
      # on PATH and `android-actions/setup-android@v3` is broken (runs
      # `sdkmanager tools` → fails). Locate sdkmanager ourselves.
      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager=$SM"
          test -n "$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speedalert-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
